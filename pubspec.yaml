name: asset_doctor
description: Clean up unused assets and compress the ones you use. Handles images, audio, video, json, fonts, xml, yaml, text and frag files.
version: 1.0.0
repository: https://github.com/andy-ife/asset_doctor

environment:
  sdk: ^3.0.0

dependencies:
  args: ^2.7.0
  image_compression: ^1.0.5
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
